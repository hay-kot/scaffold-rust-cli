# yaml-language-server: $schema=https://hay-kot.github.io/scaffold/schema.json
metadata:
  minimum_version: v0.13.0
messages:
  pre: |
    # Rust clap Project Scaffold

    Generate boilerplate code for a new Rust CLI built on clap.

  post: |
    # Get Started

    ```sh
    cd {{ .ProjectKebab }}
    mise install
    mise run run -- {{ index .Scaffold.commands 0 }}
    mise run check
    ```
skip:
  - "*mise.toml"
  - "**/.scaffold/**/*.rs"

each:
  - var: commands
    as: "{{ .Each.Item | toSnakeCase }}"

questions:
  - name: "repository"
    group: "default"
    prompt:
      message: "Repository Path"
      description: "e.g. github.com/username/project"
    required: true
  - name: "full_name"
    group: "default"
    prompt:
      message: "Developers Name"
      description: "For License and README"
    required: true
  - name: "description"
    group: "default"
    prompt:
      message: "Description"
      description: "A short, single-line description of the project"
    required: true
  - name: "open_source_license"
    group: "default"
    prompt:
      message: "License"
      description: "Choose a license for your project"
      default: "MIT license"
      options:
        - "MIT license"
        - "BSD license"
        - "ISC license"
        - "Apache Software License 2.0"
        - "GNU General Public License v3"

  - name: "commands"
    group: "cli"
    prompt:
      message: "Commands"
      description: "List of commands to generate (kebab case)"
      loop: true
    validate:
      min: 1
      match:
        regex: "^[a-z]+(-[a-z]+)*$"
        message: "inputs must be in kebab-case"

  - name: "features_cicd"
    group: "cli"
    prompt:
      message: "CI/CD"
      description: "Select CI/CD features to enable"
      multi: true
      default: ["Github Actions", "Renovate"]
      options:
        - "Github Actions"
        - "Renovate"

  - name: "features_publishing"
    group: "cli"
    prompt:
      message: "Publishing"
      description: "Select publishing targets"
      multi: true
      default: ["Docker", "Homebrew Tap"]
      options:
        - "Docker"
        - "Homebrew Tap"

  - name: "features_cli"
    group: "cli"
    prompt:
      message: "CLI Features"
      description: "Select CLI features to enable"
      multi: true
      options:
        - "File Logging"
        - "Config File"
        - "JSON Output"

  - name: "docker_registry_url"
    group: "docker"
    when: '{{ has "Docker" .features_publishing }}'
    prompt:
      message: "Docker Registry"
      description: "Registry package url (e.g ghcr.io/hay-kot/scaffold)"
      default: "ghcr.io"

  - name: "homebrew_owner"
    group: "homebrew_tap"
    when: '{{ has "Homebrew Tap" .features_publishing }}'
    prompt:
      message: "Homebrew Tap Owner"
      description: "Tap repository owner"
  - name: "homebrew_name"
    group: "homebrew_tap"
    when: '{{ has "Homebrew Tap" .features_publishing }}'
    prompt:
      message: "Homebrew Tap Name"
      description: "e.g. homebrew-scaffold-tap"
      default: "homebrew-"

computed:
  feature_gh_actions: '{{ has "Github Actions" .Scaffold.features_cicd }}'
  feature_renovate: '{{ has "Renovate" .Scaffold.features_cicd }}'

  feature_docker: '{{ has "Docker" .Scaffold.features_publishing }}'
  feature_homebrew_tap: '{{ has "Homebrew Tap" .Scaffold.features_publishing }}'
  feature_file_logging: '{{ has "File Logging" .Scaffold.features_cli }}'
  feature_config_file: '{{ has "Config File" .Scaffold.features_cli }}'
  feature_json_output: '{{ has "JSON Output" .Scaffold.features_cli }}'
  feature_paths: '{{ or (has "File Logging" .Scaffold.features_cli) (has "Config File" .Scaffold.features_cli) }}'

delimiters:
  # goreleaser and GitHub Actions use {{ }} themselves, so these files use
  # [[ ]] for scaffold template blocks.
  - glob: "*.goreleaser.yml"
    left: "[["
    right: "]]"
  - glob: "**/workflows/publish.yml"
    left: "[["
    right: "]]"

presets:
  test:
    Project: "cli-test"
    repository: "github.com/username/cli-test"
    full_name: "John Doe"
    description: "A new project"
    open_source_license: "MIT license"
    features_cicd:
      - "Github Actions"
      - "Renovate"
    features_publishing:
      - "Docker"
      - "Homebrew Tap"
    features_cli: []
    docker_registry_url: ghcr.io/hay-kot/scaffold-rust-cli
    homebrew_owner: "hay-kot"
    homebrew_name: "homebrew-scaffold-rust-cli-tap"
    commands:
      - "hello"
      - "say-goodbye"
  full:
    Project: "cli-full"
    repository: "github.com/username/cli-full"
    full_name: "John Doe"
    description: "A new project with every CLI feature"
    open_source_license: "Apache Software License 2.0"
    features_cicd:
      - "Github Actions"
      - "Renovate"
    features_publishing:
      - "Docker"
      - "Homebrew Tap"
    features_cli:
      - "File Logging"
      - "Config File"
      - "JSON Output"
    docker_registry_url: ghcr.io/hay-kot/scaffold-rust-cli
    homebrew_owner: "hay-kot"
    homebrew_name: "homebrew-scaffold-rust-cli-tap"
    commands:
      - "hello"
      - "say-goodbye"

features:
  - value: "{{ .Computed.feature_renovate }}"
    globs:
      - "**/renovate.json"
  - value: "{{ .Computed.feature_gh_actions }}"
    globs:
      - "**/workflows/**.yml"
  - value: "{{ .Computed.feature_config_file }}"
    globs:
      - "**/src/config.rs"
  - value: "{{ .Computed.feature_paths }}"
    globs:
      - "**/src/paths.rs"
  - value: "{{ .Computed.feature_homebrew_tap }}"
    globs:
      - "**/HOMEBREW_SETUP.md"
  - value: "{{ .Computed.feature_docker }}"
    globs:
      - "**/Dockerfile"
