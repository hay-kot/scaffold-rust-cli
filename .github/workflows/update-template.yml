name: Update Template Dependencies

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 9am UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Update crate, Rust and dev tool versions
        run: mise run update:deps

      - name: Pin GitHub Actions to their latest release SHAs
        run: mise run update:actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update snapshot
        run: mise run test:snapshot:update

      - name: Create pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: chore/update-template-deps
          title: "chore: update template dependencies"
          commit-message: "chore: update template dependencies"
          body: |
            This PR updates the template to the latest crate majors, Rust stable, dev tool pins in mise.toml, and GitHub Action SHA pins.
            The PR workflow renders each preset and runs its full checks.
          delete-branch: true
